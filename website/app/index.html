<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gusset – Pattern Drafter</title>
<!-- the tab's icon: the transparent red mark (TRADEMARKS.md: all rights reserved) -->
<link rel="icon" type="image/svg+xml" href="assets/brand/gusset-icon-transparent.svg">
<style>
  :root {
    /* the colours of the window */
    --canvas:  #c6c6c6;
    --grid-lo: #c0c0c0;
    --grid-hi: #cbcbcb;
    --chrome:  #2d2d2e;
    --bar:     #1e1e20;
    --menu:    #262626;
    --menu-hi: #3c3c3e;
    --rule:    #3f3f41;
    --text:    #d2d2d2;
    --dim:     #8b8b8d;
    --dimmer:  #5c5c5e;
    /* (Round UI-1 / B, the maintainer's brief) THE UI'S ONE ACCENT: the logo's orange, here and nowhere else. Grey scale, warm white and
       these. Contrast (WCAG ratio, normal / protanopia / deuteranopia, Machado 2009): --accent-line on the chrome #2d2d2e 4.87 / 3.93 / 5.50,
       on the lightest menu hover #3c3c3e 3.90 / 3.14 / 4.40 (lines and outlines need 3); --accent-text on #2d2d2e 6.70 / 5.79 / 7.30, on
       #3c3c3e 5.36 / 4.63 / 5.84 (text needs 4.5); --accent (the brand orange) only on the darkest bar #1e1e20, 4.14 / 2.95 / 4.93, as a
       mark beside a word or shape; white on --accent-fill 6.58 / 8.85 / 5.63. The 2D and 3D canvases keep their own colours (C_SEL, ...). */
    --accent:      #E8412F;
    --accent-line: #F2745F;
    --accent-text: #FF9A88;
    --accent-fill: #B02A1A;
    --accent-bg:   #4a2420;
    --warm-white:  #FAFAF7;
    --sel:     var(--accent-line);
    --paper:   #ffffff;
    --ink:     #333333;
    --seam:    #8d8d8d;
    --notch:   #ff0000;
    --base:    #5a7fa8;
    --sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bar); color: var(--text);
    font-family: var(--sans); font-size: 12px; user-select: none; -webkit-font-smoothing: antialiased; }

  #app { display: grid; grid-template-columns: 1fr 276px; grid-template-rows: 24px 1fr auto 46px;
    height: 100vh; width: 100vw; }

  /* ---- menu bar (File, Edit, 2D, …), the window's title in the middle, the mode switch at the right ---- */
  #menubar { grid-column: 1/3; background: var(--bar); display: flex; align-items: center; gap: 2px; padding: 0 6px;
    font-size: 12px; color: #d0d0d0; border-bottom: 1px solid #101011; }
  #menubar .mb { padding: 3px 8px; border-radius: 2px; cursor: pointer; }
  #menubar .mb:hover { background: var(--menu-hi); }
  #menubar .mb.on, #menubar .mb.open { background: var(--accent-bg); box-shadow: inset 0 -2px 0 var(--accent-line); color: #fff; }
  #menubar .grow { flex: 1; }
  #title { font-size: 11px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* (Round r19 / H21) the mode: one drop-down naming the one in use, as the reference's "SIMULATION be" (two buttons before) */
  #mode { display: flex; gap: 2px; }
  #mode button { background: none; border: 1px solid #4a4a4c; border-radius: 2px; color: var(--text); font-size: 10.5px; padding: 1px 8px; cursor: pointer; letter-spacing: .04em; }
  #mode button:hover { border-color: #77777c; }
  /* the library button at the top right of the window (Round CF, as the other program has it) */
  /* (Round r19 / H31) a small bookshelf, its name as the tooltip, as the reference's library symbol (it was the word with a drawing) */
  #s-find, #s-lib { display: flex; align-items: center; margin-left: 8px; background: none; border: 1px solid transparent; border-radius: 2px; color: var(--text); padding: 1px 4px; cursor: pointer; }
  #s-find:hover, #s-lib:hover { border-color: #77777c; }
  /* (Round r24) a newer version: the desktop app's button, its state in words (and its frame dashed while downloading) */
  #s-upd { margin-left: 8px; background: none; border: 1px solid var(--accent); border-radius: 2px; color: var(--text); padding: 1px 8px; font: 11px Segoe UI, Arial, sans-serif; cursor: pointer; }
  #s-upd:hover { background: #3c3c3e; }
  #s-upd:disabled { border-style: dashed; cursor: default; }
  #s-upd.ready { font-weight: 600; border-width: 2px; }
  #s-find svg, #s-lib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }

  /* ---- scrollbars: dark, everywhere (panels, lists, the timeline, dialogs) ---- */
  * { scrollbar-width: thin; scrollbar-color: #56565a #1e1e20; }
  @supports not (scrollbar-color: auto) {
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: #1e1e20; }
    ::-webkit-scrollbar-thumb { background: #56565a; border-radius: 5px; border: 2px solid #1e1e20; }
    ::-webkit-scrollbar-thumb:hover { background: #77777c; }
  }
  /* ---- canvas ---- */
  /* the two windows side by side (3D left, 2D right); each has its toolbar along the top */
  #work { display: flex; min-width: 0; min-height: 0; }
  .pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; padding-top: 19px; }
  /* (Round r19 / H18) each window its own title strip, as the reference's (one title over both before, in the menu bar) */
  .wt { position: absolute; left: 0; right: 0; top: 0; height: 19px; line-height: 18px; font-size: 11px; color: #c4c4c4; text-align: center; background: var(--bar);
    border-bottom: 1px solid #101011; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 24px; }
  /* (Round r19 follow-up, the maintainer's H20) a window taken out: floating over the page, moved by its title, sized at its corner */
  .wt .wt-float { position: absolute; right: 2px; top: 0; height: 18px; width: 20px; background: none; border: none; color: #c4c4c4; cursor: pointer; font-size: 11px; padding: 0; }
  .wt .wt-float:hover { background: #ffffff1c; }
  .pane.floating { position: fixed; z-index: 30; flex: none !important; border: 1px solid #555; box-shadow: 0 8px 26px #000b; resize: both; overflow: hidden; min-width: 240px; min-height: 180px; }
  .pane.floating .wt { cursor: move; }
  #pane3d { border-right: 1px solid #171718; }
  /* the 2D window: the drawing area, with its toolbar down the right side in two columns */
  #pane2d { flex-direction: row; }
  #rail { order: 2; display: grid; grid-template-columns: 31px 31px; grid-auto-rows: 31px; align-content: start; gap: 1px;
    width: 70px; padding: 3px; border-bottom: none; border-left: 1px solid #171718; overflow-y: auto; overflow-x: hidden; }
  #rail::before { display: none; }
  #rail .railsep { display: none; }                  /* two unbroken columns */
  /* the splitter between the two windows: dark, dragged left and right (only while both are shown) */
  #split { flex: 0 0 7px; background: #0f0f10; border-left: 1px solid #000; border-right: 1px solid #29292b; cursor: col-resize; touch-action: none; }
  #split:hover, #split:active { background: #3a3a3e; }
  /* a toolbar is dragged by its empty part to dock it elsewhere; the tools keep their own cursor */
  .rail { cursor: grab; } .rail .slot, .rail .tool { cursor: pointer; }
  #dockhint { display: none; position: fixed; z-index: 96; background: #e8412f2e; border: 1px dashed var(--sel); pointer-events: none; }
  /* the 2D toolbar docked along the top of its window */
  #pane2d.dock-top { flex-direction: column; }
  #pane2d.dock-top #rail { order: -1; display: flex; flex-wrap: wrap; width: auto; padding: 2px 4px; border-left: none; border-bottom: 1px solid #171718; overflow: visible; }
  #pane2d.dock-top #rail::before { display: inline; }
  #pane2d.dock-top #rail .railsep { display: block; }
  /* the 3D toolbar docked down the left of its window, in two columns */
  #pane3d.dock-left { flex-direction: row; }
  #pane3d.dock-left #rail3d { display: grid; grid-template-columns: 31px 31px; grid-auto-rows: 31px; align-content: start; gap: 1px; width: 70px; padding: 3px; border-bottom: none; border-right: 1px solid #171718; overflow-y: auto; overflow-x: hidden; }
  #pane3d.dock-left #rail3d::before, #pane3d.dock-left #rail3d .railsep { display: none; }
  /* the display selectors: five small buttons in the corner of the 2D window, each opening a list of switches */
  .selectors { position: absolute; left: 22px; top: 22px; display: flex; flex-direction: column; gap: 3px; background: #2d2d2ee6;
    border: 1px solid #171718; border-radius: 4px; padding: 3px; z-index: 5; }
  .selectors button { width: 24px; height: 24px; border: 1px solid transparent; border-radius: 2px; background: none; cursor: pointer; padding: 0; display: grid; place-items: center; }
  .selectors button:hover { background: #ffffff1c; }
  .selectors button.on { border-color: var(--sel); }
  .selectors button svg { width: 18px; height: 18px; fill: none; stroke: #d6d6d6; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #sel3d { left: 8px; top: 8px; }
  /* (Round FIX-2 / C10) the fabric Material tabs Front / Back / Side: the one in front bold and underlined, not told by colour alone */
  .facetabs { display: flex; gap: 2px; margin: 4px 0 6px; border-bottom: 1px solid #4a4a4e; }
  .facetabs .ftab { background: none; border: none; color: var(--dim); padding: 3px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .facetabs .ftab.on { color: #f0f0f0; font-weight: 600; border-bottom-color: var(--accent-line); }
  /* (Round FIX-2 / C5) the 3D column's dividers: a gap and a rule between the render switches, the display lists and Render */
  .selectors .sel-div { height: 1px; margin: 5px 3px; background: #8a8a8e; flex: none; }
  /* Print Layout: its own pane, a bar of commands over one large sheet view */
  #lay-bar { gap: 4px; padding: 4px 6px; }
  #lay-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--canvas); }
  #lc { display: block; width: 100%; height: 100%; }
  #sel-lay { left: 8px; top: 8px; }
  /* (Round r19 / H23, H28) the fabric tabs along the top of Print Layout; its commands as icons down its right edge */
  #lay-bar .laytab { background: none; border: none; border-bottom: 2px solid transparent; color: #c4c4c4; font-size: 11px; padding: 3px 14px; cursor: pointer; flex: none; }
  #lay-bar .laytab:hover { background: #ffffff14; } #lay-bar .laytab.on { border-bottom-color: var(--accent-line); color: #fff; font-weight: 600; }
  #lay-tools { position: absolute; right: 0; top: 0; bottom: 0; width: 36px; display: flex; flex-direction: column; gap: 2px; padding: 4px 3px; background: var(--chrome); border-left: 1px solid #171718; z-index: 5; }
  #lay-tools button { width: 30px; height: 28px; border: 1px solid transparent; border-radius: 2px; background: none; cursor: pointer; padding: 0; display: grid; place-items: center; }
  #lay-tools button:hover:not(:disabled) { background: #ffffff1c; } #lay-tools button.on { border-color: var(--sel); }
  #lay-tools button:disabled { opacity: .35; cursor: default; }
  #lay-tools button svg { width: 20px; height: 20px; fill: none; stroke: #d6d6d6; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #lay-tools .sep { height: 1px; background: #3a3a3e; margin: 3px 2px; flex: none; }
  #stage { position: relative; background: var(--canvas); overflow: hidden; flex: 1; min-height: 0; }
  #stage3d { position: relative; isolation: isolate; background: #9c9c9f; overflow: hidden; flex: 1; min-height: 0; }
  #box3d { display: none; position: absolute; border: 1px dashed #fff; background: #ffffff22; pointer-events: none; }
  #lasso3d { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  /* (Round UI-1b / B) the view cube and its house (above left of it), in the corner where the eight view buttons were */
  #cam3d { position: absolute; right: 4px; top: 4px; width: 148px; height: 148px; z-index: 4; }
  #cam3d #vcube { display: block; width: 148px; height: 148px; cursor: grab; touch-action: none; }
  /* (Round UI-1c / C, the maintainer's brief) Home: the house alone, no button or frame, small and half see-through grey, close to the
     cube's top left corner; under the pointer whole, orange and its lines thicker (the thickness as well as the colour) */
  /* (Round FIX-2 / C4, the maintainer's feedback) Home only while the pointer is near the cube or on it (it fades with the step arrows, --vnear
     set by vcubeNear()), bigger, by the cube's top left corner */
  #cam3d #vhome { position: absolute; left: 2px; top: 2px; width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: none; border: none; color: #3a3a3e; opacity: calc(var(--vnear, 0) * .8); cursor: pointer; }
  #cam3d #vhome:hover, #cam3d #vhome:focus-visible { opacity: 1; color: var(--accent); }
  #cam3d #vhome svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #cam3d #vhome:hover svg { stroke-width: 2.3; }
  #posepanel { display: none; position: absolute; right: 8px; top: 156px; bottom: 26px; width: 268px; overflow-y: auto; background: #2b2b2ef2; border: 1px solid #1a1a1c; color: #d8d8dc; font: 11px Segoe UI, Arial, sans-serif; padding: 6px 8px; }
  #posepanel .pph { display: flex; align-items: center; margin-bottom: 4px; } #posepanel .pph .grow { flex: 1; }
  #posepanel button, #posepanel select { background: #3a3a3e; color: #e4e4e8; border: 1px solid #1a1a1c; font: 11px Segoe UI, Arial, sans-serif; padding: 2px 6px; cursor: pointer; }
  #posepanel .ppb { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; } #posepanel .ppb select { flex: 1; min-width: 0; }
  #posepanel .ppr, #posepanel .ppx { display: grid; grid-template-columns: 84px 1fr 1fr 1fr; gap: 4px; align-items: center; margin: 1px 0; }
  #posepanel .ppx { font: 9px var(--mono); color: #9a9aa0; text-align: center; }
  #posepanel .ppr input { width: 100%; min-width: 0; margin: 0; height: 14px; }
  #posepanel .note { color: #b8b8be; margin: 6px 0; }
  /* (Round r18 / 2) the Avatar Joint panel: the 3D window's top right corner, left of the pose panel when both are open */
  /* (Round r18 / 4) the Avatar Editor, in the 2D window's place, and the two tabs at the bottom of that place */
  #aved { position: absolute; left: 0; right: 0; top: 0; bottom: 26px; z-index: 31; background: var(--chrome); color: #e4e4e4; display: flex; flex-direction: column; font-size: 12px; }
  #aved .ae-title { display: flex; align-items: center; padding: 3px 8px; background: #242426; border-bottom: 1px solid #101011; } #aved .ae-title span { flex: 1; text-align: center; }
  #aved .ae-title button { background: none; border: none; color: #e4e4e4; font-size: 16px; cursor: pointer; }
  #aved .ae-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #3a3a3e; }
  #aved .ae-tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: #cfcfd4; padding: 4px 8px; cursor: pointer; font: 12px Segoe UI, Arial, sans-serif; }
  #aved .ae-tabs button.on { color: #fff; font-weight: 600; border-bottom-color: var(--accent-line); }
  #aved .ae-body { flex: 1; overflow: auto; padding: 8px 14px 14px; }
  #aved .ae-icons { display: flex; justify-content: flex-end; gap: 4px; } #aved .ae-icons button { background: none; border: 1px solid transparent; color: #e4e4e4; cursor: pointer; font-size: 14px; }
  #aved .ae-sec { display: flex; align-items: center; gap: 6px; margin: 6px 0; } #aved .ae-sec b { border-left: 2px solid #d8d8dc; padding-left: 6px; margin-right: auto; font-weight: 600; }
  #aved select, #aved input[type="text"] { background: #1e1e20; color: #e4e4e8; border: 1px solid #101011; font: 12px Segoe UI, Arial, sans-serif; padding: 2px 4px; }
  #aved input[type="text"] { width: 72px; text-align: right; font-family: var(--mono); } #aved input.set { border-color: #e4e4e8; font-weight: 700; }
  #aved .ae-wh { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 8px; } #aved .ae-wh label { margin-left: 6px; }
  #aved .ae-link { background: #3a3a3e; color: #e4e4e8; border: 1px solid #101011; cursor: pointer; padding: 1px 4px; } #aved .ae-link.on { background: var(--accent-line); color: #111; }
  #aved .ae-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  #aved .ae-box { background: #2b2b2e; padding: 6px 10px 8px; } #aved .ae-box h4 { margin: 4px 0; font-weight: 500; color: #cfcfd4; display: flex; justify-content: space-between; }
  #aved .ae-box h4 button { background: none; border: none; color: #e4e4e4; cursor: pointer; }
  #aved .ae-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; } #aved .ae-row label { flex: 1; color: #d8d8dc; } #aved .ae-row input[type="range"] { width: 110px; }
  #aved .ae-got { font: 10px var(--mono); color: #b8b8be; min-width: 52px; } #aved .ae-u { color: #9a9aa0; }
  #aved .ae-ends { display: flex; justify-content: space-between; color: #9a9aa0; font-size: 10px; padding-left: 40%; }
  #aved .hint { color: #b8b8be; margin: 10px 0; }
  #aved .ae-list { background: #2b2b2e; min-height: 160px; max-height: 40%; overflow: auto; padding: 4px 0; margin-bottom: 8px; } #aved .ae-tree { padding: 2px 10px; color: #cfcfd4; }
  #aved .ae-item { display: flex; width: 100%; align-items: center; gap: 6px; background: none; border: none; color: #d8d8dc; padding: 3px 10px 3px 26px; text-align: left; cursor: pointer; font: 12px Segoe UI, Arial, sans-serif; }
  #aved .ae-item.on { background: var(--accent-bg); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent-line); }
  #aved .ae-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: auto; box-shadow: 0 0 0 1px #111; }
  #aved .ae-props.off { opacity: 0.5; } #aved .ae-ro { font-family: var(--mono); color: #d8d8dc; } #aved input.wide { width: 180px; text-align: left; font-family: Segoe UI, Arial, sans-serif; }
  #aved .ae-chk { flex: 0 0 auto !important; }
  #aved .ae-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } #aved .ae-col { min-width: 0; } #aved .ae-col .ae-list { max-height: 200px; }
  #aved .ae-col .ae-row input[type="range"] { width: 90px; }

  #aved .ae-body path { fill: #4a4a50; } #aved .ae-body circle.on { fill: #ffffff; stroke: #111; stroke-width: 1.2; } #aved .ae-body circle.off { fill: none; stroke: #e4e4e8; stroke-width: 1; stroke-dasharray: 1.6 1.2; }

     its slot, 10 px between X's number and Y */

  #status #s-hist { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 9px; border: 1px solid #4a4a4c; border-radius: 4px; font: 12px var(--sans); color: var(--text); letter-spacing: .02em; }

/* (Round r24) The start-up splash in a browser: the mark sewing itself together while the scripts load. It goes once the page
   has loaded (gussetSplashEnd(), from the app), SPLASH_MIN after the page's start at the earliest, fading in 0.2 s (the marks
   "gusset-ready" and "gusset-splash-gone"); a click on it skips it (and goes no further). The desktop app has a splash window
   of its own: there it is taken away before anything is drawn. */
(function () {
  var el = document.getElementById("splash"), MIN = 600, done = false;
  if (!el) return;
  if (window.desktop) { el.parentNode.removeChild(el); return; }
  function end() {
    if (done) return;
    done = true; el.className = "out";
    try { performance.mark("gusset-splash-gone"); } catch (e) {}
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }
  el.addEventListener("pointerdown", function (e) { e.preventDefault(); e.stopPropagation(); end(); });
  window.gussetSplashEnd = function () { setTimeout(end, Math.max(0, MIN - performance.now())); };
})();
