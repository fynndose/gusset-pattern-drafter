# The desktop app for Windows, macOS (Apple chip and Intel) and Linux, built, checked and attached to one pre-release.
# Runs when a tag v* is pushed (a DRAFT release for that tag, which the maintainer publishes by hand in GitHub's page) or by hand
# (Actions > Release > Run workflow: a dry run, everything but the release, the files kept as the run's artifacts).
#   each system: the unit tests (not the slow drapes), the release check where this repository has it, the build, the
#   desktop check on the built app's files, the built app itself started and driven, then the files and their SHA-256 uploaded
#   then: the draft release for the tag (a pre-release if the version says so), with every file, SHA256SUMS.txt and docs/release-notes/<version>.md (the
#   checksums added to its text)
# "all" and a tag are win-x64 (installer and portable), mac-arm64, mac-x64, linux-x64. A private repository's macOS minutes count ten times: there "all" leaves out the Intel Mac.
# By hand the pre-release job runs too, as a dry run: everything but making the release.
# Every build is given where the app looks for updates (PDRAFT_UPDATE_SOURCE: the input update_source, else the repository
# variable, else the public repository; "none": such a build does not look for updates), and carries the channel files the app reads (beta.yml or
# latest.yml, -mac.yml, -linux.yml) and the blockmaps, checked by scripts/update-files-check.js before the release takes
# them, in the dry run too.
# The website's list of downloads (scripts/make-downloads.js): GitHub's "latest release" leaves out pre-releases, so the list is
# worked out from all the releases. The pre-release job attaches this build's list to the draft (a dry run prints it). When the
# maintainer publishes a release, the job site-downloads writes website/downloads.json from every release that is out and commits
# it, which is what puts it on the website. That job runs only in the public repository.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      systems:
        description: "Which systems to build and check: all (win-x64, mac-arm64, mac-x64, linux-x64), or some of win-x64, mac-arm64, mac-x64, linux-x64 (comma-separated)"
        default: all
      probe:
        description: "Instead of building: webgl (the Intel Mac) or webgl-arm (the Apple-chip Mac) tries Chromium's WebGL switches (a few minutes)"
        default: ""
      update_source:
        description: "Where the built app looks for updates: github:<owner>/<repo> or an https address (empty: the variable PDRAFT_UPDATE_SOURCE, else the public repository; none: the app does not look)"
        default: ""

# one run per tag or branch at a time: a newer one stops the older
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# where the built apps look for updates; "none" for builds that do not look
env:
  PDRAFT_UPDATE_SOURCE: ${{ inputs.update_source || vars.PDRAFT_UPDATE_SOURCE || 'github:fynndose/gusset-pattern-drafter' }}

jobs:
  # the systems this run builds
  plan:
    if: github.event_name != 'release' && (inputs.probe == '' || inputs.probe == null)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SYSTEMS: ${{ inputs.systems }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          node -e '
            const all = [{ os: "windows-latest", name: "win-x64", softgl: "1" }, { os: "macos-latest", name: "mac-arm64" },
              { os: "macos-15-intel", name: "mac-x64", nogl: "1" }, { os: "ubuntu-latest", name: "linux-x64" }];
            const want = (process.env.SYSTEMS || "all").split(",").map(s => s.trim()).filter(Boolean);
            const pick = want.includes("all") ? all.filter(x => !(process.env.PRIVATE_REPO === "true" && x.name === "mac-x64")) : all.filter(x => want.includes(x.name));
            if (!pick.length) { console.error("no system named: " + want); process.exit(1); }
            console.log("matrix=" + JSON.stringify({ include: pick }));' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # (by hand only) which of Chromium's switches give WebGL on a Mac build machine
  probe:
    if: startsWith(inputs.probe, 'webgl')
    runs-on: ${{ inputs.probe == 'webgl-arm' && 'macos-latest' || 'macos-15-intel' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: |
          npm ci --no-audit --no-fund --prefix desktop
          node desktop/node_modules/electron/install.js
      - name: WebGL with each set of switches
        shell: bash
        run: |
          P="$RUNNER_TEMP/probe"; mkdir -p "$P"
          cat > "$P/main.js" <<'EOF'
          const { app, BrowserWindow } = require("electron");
          app.whenReady().then(async () => {
            const w = new BrowserWindow({ show: true, width: 400, height: 300 });
            await w.loadURL("data:text/html,<body></body>");
            const r = await w.webContents.executeJavaScript(`(() => { const out = []; for (let k = 0; k < 6; k++) { const c = document.createElement("canvas"); const g = c.getContext("webgl2") || c.getContext("webgl"); if (!g) { out.push("none"); continue; } const d = g.getExtension("WEBGL_debug_renderer_info"); out.push(d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : "yes"); const l = g.getExtension("WEBGL_lose_context"); if (l) l.loseContext(); } return out; })()`);
            console.log("RESULT " + JSON.stringify({ gl: [...new Set(r)], ok: r.filter(x => x !== "none").length + "/6", gpu: app.getGPUFeatureStatus().webgl2 }));
            app.exit(0);
          });
          EOF
          E=$(node -p "require('./desktop/node_modules/electron')")
          echo "Electron: $E"; ls -la "$E" || true
          for F in "" "--use-angle=swiftshader --enable-unsafe-swiftshader" "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
                   "--use-angle=swiftshader-webgl --enable-unsafe-swiftshader" "--disable-gpu --enable-unsafe-swiftshader" "--use-angle=metal" "--use-gl=swiftshader --enable-unsafe-swiftshader"; do
            echo "=== switches: [$F]"
            perl -e "alarm 60; exec @ARGV" "$E" $F "$P/main.js" 2>&1 | grep -v "DEP0040|punycode" | tail -12 || echo "(exit $?)"
          done

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"              # Playwright drives the built app only: no browser of its own
      PDRAFT_SOFT_GL: ${{ matrix.softgl }}              # Windows: WebGL from Chromium's software renderer (Linux has it anyway; on a Mac it breaks WebGL: the probe)
      PDRAFT_SMOKE_SLOW: "4"                             # no graphics card, slow processors: the desktop check waits 4 times as long
      PDRAFT_NO_WEBGL: ${{ matrix.nogl }}                # the Intel Mac build machine has no WebGL at all (the WebGL probe): its 3D checks are listed as not checked
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Electron's and electron-builder's downloads, kept between runs
      - name: Download caches
        shell: bash
        run: |
          H=$(node -p "require('path').join(require('os').homedir(), '.pdraft-cache')")
          echo "ELECTRON_CACHE=$H/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$H/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.pdraft-cache
          key: pdraft-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop
          # npm leaves out install scripts it was not told to run: Electron's binary is fetched here
          node desktop/node_modules/electron/install.js

      # Linux: a display for the app (xvfb), and Chromium's sandbox allowed by the system
      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # one known bug may fail here, on an Apple chip only: the 270° fold test (r14 / 2) settles at 106°
      # there (104° elsewhere, limit 90 ± 15) because a fold line's edges disagree (78–138°) and the test takes their mean.
      # It stays in the suite, unchanged; any other failure, or this one anywhere else, stops the build.
      - name: Unit tests (not the slow drapes)
        shell: bash
        run: |
          set +e
          node drafter/tests/run.js --fast > "$RUNNER_TEMP/tests.log" 2>&1; code=$?
          set -e
          cat "$RUNNER_TEMP/tests.log"
          if [ $code -ne 0 ]; then
            fails=$(grep -c '^  FAIL ' "$RUNNER_TEMP/tests.log")
            if [ "$RUNNER_ARCH" = ARM64 ] && [ "$fails" = 1 ] && grep -q '^  FAIL r14 / 2: the solver folds the cloth along a fold line' "$RUNNER_TEMP/tests.log"; then
              echo "::warning title=Known bug::r14 / 2 (the 270° fold) fails on an Apple chip: the fold line is wavy. Released as a known bug (Round desk-2)."
            else exit $code; fi
          fi

      # the release check stays in the private repository (it names what must not be published); the public one has no such file
      - name: Release check (the source)
        if: hashFiles('scripts/release-check.js') != ''
        run: npm run release-check

      - name: Build (and the package check on what the app holds)
        shell: bash
        env:
          PDRAFT_STAGE: ${{ runner.temp }}/stage
          PDRAFT_KEEP_STAGE: "1"
        run: node desktop/build.js

      - name: Desktop check on the built app's files
        shell: bash
        run: |
          export PDRAFT_SMOKE_APP=$(node -p "require(process.env.RUNNER_TEMP + '/stage/unpacked.json').resources")
          # the real-mouse and worker checks can fail once on timing: a second run decides
          npm run smoke:desktop || { echo "--- once more ---"; npm run smoke:desktop; }

      - name: The built app started and driven
        shell: bash
        run: |
          RUN="node scripts/start-built.js $RUNNER_TEMP/stage/unpacked.json $RUNNER_TEMP/start"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a $RUN"; fi
          $RUN || { echo "--- once more ---"; rm -rf "$RUNNER_TEMP/start"; $RUN; }

      - name: Sizes
        shell: bash
        run: ls -l desktop/dist

      - uses: actions/upload-artifact@v7
        with:
          name: gusset-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.sha256
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.name }}
          path: ${{ runner.temp }}/start
          if-no-files-found: ignore
          retention-days: 14

  # a tag: the draft release, never published here. By hand (Round r22): a dry run of the same job (the files downloaded, the checksums and the
  # notes put together, the title shown) that creates no release and no tag
  release:
    name: pre-release
    needs: build
    if: github.event_name != 'release' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gusset-*
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DRY: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          V="${TAG#v}"
          CONFIG=$(node -p "require('./drafter/config.js').version")
          if [ "$DRY" = true ]; then V="$CONFIG"; echo "Dry run (no tag): version $V from drafter/config.js";
          elif [ "$V" != "$CONFIG" ]; then echo "The tag says $V, drafter/config.js says $CONFIG"; exit 1; fi
          # (Round r24) the update check's channel files: this version, and every file they name here and matching
          if [ "$PDRAFT_UPDATE_SOURCE" != none ]; then node scripts/update-files-check.js dist "$V"; else echo "Update source none: these builds do not look for updates, so there are no channel files"; fi
          NOTES="docs/release-notes/$V.md"
          test -f "$NOTES" || { echo "No release notes at $NOTES"; exit 1; }
          (cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # the website's list for this build: the same in a dry run. (After the checksums, so that it is not one of the files they list)
          node scripts/make-downloads.js --dist dist --version "$V" --repo "$GITHUB_REPOSITORY" --out dist/downloads.json
          cat dist/downloads.json
          BODY="$RUNNER_TEMP/body.md"
          { cat "$NOTES"; printf '\n## SHA-256 of each file\n\n```\n'; cat dist/SHA256SUMS.txt; printf '```\n'; } > "$BODY"
          TITLE="Gusset – Pattern Drafter "$(echo "$V" | sed -E 's/-(alpha|beta|rc)\./ \1 /')
          if [ "$DRY" = true ]; then echo "Would make the draft release \"$TITLE\" with:"; ls -l dist; head -5 "$BODY"; tail -8 "$BODY"; exit 0; fi
          PRE=false; case "$V" in *-*) PRE=true ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease="$PRE" --title "$TITLE" --notes-file "$BODY"
          else
            gh release create "$TAG" --draft --prerelease="$PRE" --verify-tag --title "$TITLE" --notes-file "$BODY"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'

  # a release published by hand: website/downloads.json from every release that is out, committed to the default
  # branch, from where the website is deployed. A push with this job's token starts no workflow, so this cannot go round in a circle
  site-downloads:
    name: the website's list of downloads
    if: github.event_name == 'release' && github.repository == 'fynndose/gusset-pattern-drafter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Write and commit the list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP" || true
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/make-downloads.js --api "$RUNNER_TEMP/releases.json" --sums "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --out website/downloads.json
          if git diff --quiet -- website/downloads.json; then echo "The list has not changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/downloads.json
          git commit -m "The website's list of downloads, after $TAG"
          git push
