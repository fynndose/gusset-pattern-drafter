# The desktop app for Windows, macOS (Apple chip and Intel) and Linux, built, checked and attached to one pre-release.
# Runs when a tag v* is pushed (a DRAFT release for that tag, which the maintainer publishes by hand in GitHub's page) or by hand
# (Actions > Release > Run workflow: a dry run, everything but the release, the files kept as the run's artifacts).
#   each system: the unit tests (not the slow drapes), the release check where this repository has it, the build, the
#   desktop check on the built app's files, the built app itself started and driven, then the files and their SHA-256 uploaded
#   then: the draft release for the tag (a pre-release if the version says so), with every file, SHA256SUMS.txt and docs/release-notes/<version>.md (the
#   checksums added to its text)
# "all" and a tag are win-x64 (installer and portable), mac (both Mac apps, below), linux-x64; with mac, in the public repository, the optional
# mac-arm64-check. A private repository's macOS minutes count ten times: there the optional check runs only when named.
# (beta.3 release fix: the v1.0.0-beta.3 run failed twice because no Apple-chip build machine was free.) A release is never held up by one kind
# of build machine:
#   - Both Mac apps are built on the Intel Mac in one run (the Apple-chip app cross-built: electron-builder fetches that arch's Electron and signs it
#     ad hoc there), so one -mac.yml names both (two jobs each wrote their own, and beta.2's release kept only the Intel one). The Intel app is tested
#     and started there; the Apple-chip one gets what can be checked without running it (its arch, its signature, its size beside the Intel one's,
#     the disk image and the zip read whole). mac-arm64-check then starts that very zip on an Apple chip, if one is free: it never holds up the release.
#   - A system whose build never ran (no machine came, cancelled) is missing, not a failure: the draft is made with the rest, its notes say what
#     is missing, and a run by hand from the tag with "attach" adds it later (the maintainer's launch checklist). A step that failed after Install
#     (a test, a check, the build) is real (failed-<system>-<attempt>), and stops the release.
# Every build is given where the app looks for updates (PDRAFT_UPDATE_SOURCE: the input update_source, else the repository
# variable, else the website's update feed, not the public repository; "none": such a build does not look for updates), and carries the channel files the app reads (beta.yml or
# latest.yml, -mac.yml, -linux.yml) and the blockmaps, checked by scripts/update-files-check.js before the release takes
# them, in the dry run too.
# The website's list of downloads (scripts/make-downloads.js): GitHub's "latest release" leaves out pre-releases, so the list is
# worked out from all the releases. The pre-release job attaches this build's list to the draft (a dry run prints it). When the
# maintainer publishes a release, the job site-downloads writes website/downloads.json from every release that is out and commits
# it, which is what puts it on the website; also after files were added to a release that is out already. That job runs only in the public repository.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      systems:
        description: "Which systems to build and check: all, or some of win-x64, mac (both Mac apps), linux-x64, mac-arm64-check (the Apple-chip app started on an Apple chip; optional), comma-separated"
        default: all
      attach:
        description: "Add the built files to the release of the tag this run is started from (Use workflow from > Tags), for a system it is missing. Off: a dry run"
        type: boolean
        default: false
      probe:
        description: "Instead of building: webgl (the Intel Mac) or webgl-arm (the Apple-chip Mac) tries Chromium's WebGL switches (a few minutes)"
        default: ""
      update_source:
        description: "Where the built app looks for updates: an https address or github:<owner>/<repo> (empty: the variable PDRAFT_UPDATE_SOURCE, else the public repository; none: the app does not look)"
        default: ""

# one run per tag or branch at a time: a newer one stops the older
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# where the built apps look for updates; "none" for builds that do not look
env:
  PDRAFT_UPDATE_SOURCE: ${{ inputs.update_source || vars.PDRAFT_UPDATE_SOURCE || 'https://gussetdrafter.com/updates/' }}

jobs:
  # the systems this run builds
  plan:
    if: github.event_name != 'release' && (inputs.probe == '' || inputs.probe == null)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      armcheck: ${{ steps.m.outputs.armcheck }}
    steps:
      - id: m
        env:
          SYSTEMS: ${{ inputs.systems }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          node -e '
            // (both Mac apps on the Intel Mac: macos-15-intel. When GitHub retires Intel machines, build both on an Apple-chip one: arch "arm64,x64", and the Intel app is then the cross-built one)
            const all = [{ os: "windows-latest", name: "win-x64", softgl: "1" }, { os: "macos-15-intel", name: "mac", arch: "x64,arm64", nogl: "1" },
              { os: "ubuntu-latest", name: "linux-x64" }];
            const want = (process.env.SYSTEMS || "all").split(",").map(s => s.trim()).filter(Boolean).map(s => (s === "mac-x64" || s === "mac-arm64" ? "mac" : s));
            const pick = want.includes("all") ? all : all.filter(x => want.includes(x.name));
            if (!pick.length) { console.error("no system named: " + want); process.exit(1); }
            const arm = pick.some(x => x.name === "mac") && (want.includes("mac-arm64-check") || process.env.PRIVATE_REPO !== "true");
            console.log("matrix=" + JSON.stringify({ include: pick }));
            console.log("armcheck=" + arm);' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # (by hand only) which of Chromium's switches give WebGL on a Mac build machine
  probe:
    if: startsWith(inputs.probe, 'webgl')
    runs-on: ${{ inputs.probe == 'webgl-arm' && 'macos-latest' || 'macos-15-intel' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: |
          npm ci --no-audit --no-fund --prefix desktop
          node desktop/node_modules/electron/install.js
      - name: WebGL with each set of switches
        shell: bash
        run: |
          P="$RUNNER_TEMP/probe"; mkdir -p "$P"
          cat > "$P/main.js" <<'EOF'
          const { app, BrowserWindow } = require("electron");
          app.whenReady().then(async () => {
            const w = new BrowserWindow({ show: true, width: 400, height: 300 });
            await w.loadURL("data:text/html,<body></body>");
            const r = await w.webContents.executeJavaScript(`(() => { const out = []; for (let k = 0; k < 6; k++) { const c = document.createElement("canvas"); const g = c.getContext("webgl2") || c.getContext("webgl"); if (!g) { out.push("none"); continue; } const d = g.getExtension("WEBGL_debug_renderer_info"); out.push(d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : "yes"); const l = g.getExtension("WEBGL_lose_context"); if (l) l.loseContext(); } return out; })()`);
            console.log("RESULT " + JSON.stringify({ gl: [...new Set(r)], ok: r.filter(x => x !== "none").length + "/6", gpu: app.getGPUFeatureStatus().webgl2 }));
            app.exit(0);
          });
          EOF
          E=$(node -p "require('./desktop/node_modules/electron')")
          echo "Electron: $E"; ls -la "$E" || true
          for F in "" "--use-angle=swiftshader --enable-unsafe-swiftshader" "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader" \
                   "--use-angle=swiftshader-webgl --enable-unsafe-swiftshader" "--disable-gpu --enable-unsafe-swiftshader" "--use-angle=metal" "--use-gl=swiftshader --enable-unsafe-swiftshader"; do
            echo "=== switches: [$F]"
            perl -e "alarm 60; exec @ARGV" "$E" $F "$P/main.js" 2>&1 | grep -v "DEP0040|punycode" | tail -12 || echo "(exit $?)"
          done

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"              # Playwright drives the built app only: no browser of its own
      PDRAFT_SOFT_GL: ${{ matrix.softgl }}              # Windows: WebGL from Chromium's software renderer (Linux has it anyway; on a Mac it breaks WebGL: the probe)
      PDRAFT_SMOKE_SLOW: "4"                             # no graphics card, slow processors: the desktop check waits 4 times as long
      PDRAFT_NO_WEBGL: ${{ matrix.nogl }}                # the Intel Mac build machine has no WebGL at all (the WebGL probe): its 3D checks are listed as not checked
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Electron's and electron-builder's downloads, kept between runs (the Mac's: both arches' Electron). Keyed by the system's name, never by matrix.arch: a cache key takes no comma (the first dry run of the beta.3 fix stopped on "x64,arm64")
      - name: Download caches
        shell: bash
        run: |
          H=$(node -p "require('path').join(require('os').homedir(), '.pdraft-cache')")
          echo "ELECTRON_CACHE=$H/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$H/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.pdraft-cache
          key: pdraft-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('desktop/package-lock.json') }}

      # (a failure up to here is the machine's or the network's, not the program's: no failed-<system> mark, so the release goes on without it)
      - name: Install
        id: install
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop
          # npm leaves out install scripts it was not told to run: Electron's binary is fetched here
          node desktop/node_modules/electron/install.js

      # Linux: a display for the app (xvfb), and Chromium's sandbox allowed by the system
      - name: Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # (Round POLISH-1: the fold line's wavy crease is fixed, so the Apple chip's one allowed failure, r14 / 2, is gone: any failure stops the build)
      - name: Unit tests (not the slow drapes)
        shell: bash
        run: node drafter/tests/run.js --fast

      # the release check stays in the private repository (it names what must not be published); the public one has no such file
      - name: Release check (the source)
        if: hashFiles('scripts/release-check.js') != ''
        run: npm run release-check

      - name: Build (and the package check on what the app holds)
        shell: bash
        env:
          PDRAFT_STAGE: ${{ runner.temp }}/stage
          PDRAFT_KEEP_STAGE: "1"
          BUILD_ARCH: ${{ matrix.arch }}
        run: node desktop/build.js ${BUILD_ARCH:+--arch=$BUILD_ARCH}

      # the Apple-chip app cannot run on this machine: what can be checked without running it
      - name: The Apple-chip app, checked without running it
        if: matrix.name == 'mac'
        shell: bash
        run: |
          for A in x64 arm64; do
            APP=$(node -p "require(process.env.RUNNER_TEMP + '/stage/unpacked-$A.json').app"); EXE=$(node -p "require(process.env.RUNNER_TEMP + '/stage/unpacked-$A.json').exe")
            WANT=$([ "$A" = x64 ] && echo x86_64 || echo arm64)
            for B in "$EXE" "$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"; do
              GOT=$(lipo -archs "$B"); echo "$A: $(basename "$B"): $GOT"
              [ "$GOT" = "$WANT" ] || { echo "::error::$B is $GOT, not $WANT"; exit 1; }
            done
            # (an Apple chip runs no code without a signature: here an ad hoc one)
            codesign --verify --deep --verbose=2 "$APP"
          done
          for K in dmg zip; do
            node -e 'const fs = require("fs"), [x, r] = process.argv.slice(1), q = fs.statSync(r).size / fs.statSync(x).size; console.log(r + ": " + (q * 100).toFixed(0) + " % of the Intel one"); if (q < 0.75 || q > 1.25) { console.log("::error::the Apple-chip " + r + " is not near the Intel one in size"); process.exit(1); }' desktop/dist/*-mac-x64.$K desktop/dist/*-mac-arm64.$K
          done
          for D in desktop/dist/*.dmg; do hdiutil verify "$D"; done
          for Z in desktop/dist/*-mac-*.zip; do unzip -tq "$Z"; done

      - name: Desktop check on the built app's files
        shell: bash
        run: |
          export PDRAFT_SMOKE_APP=$(node -p "require(process.env.RUNNER_TEMP + '/stage/unpacked.json').resources")
          # the real-mouse and worker checks can fail once on timing: a second run decides
          npm run smoke:desktop || { echo "--- once more ---"; npm run smoke:desktop; }

      - name: The built app started and driven
        shell: bash
        run: |
          RUN="node scripts/start-built.js $RUNNER_TEMP/stage/unpacked.json $RUNNER_TEMP/start"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a $RUN"; fi
          $RUN || { echo "--- once more ---"; rm -rf "$RUNNER_TEMP/start"; $RUN; }

      - name: Sizes
        shell: bash
        run: ls -l desktop/dist

      - uses: actions/upload-artifact@v7
        with:
          name: gusset-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.sha256
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.name }}
          path: ${{ runner.temp }}/start
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      # a real failure (after Install: a test, a check, the build): the release job stops on this mark
      - name: Mark a real failure
        if: failure() && steps.install.outcome == 'success'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/failed" && echo "${{ matrix.name }} failed in attempt ${{ github.run_attempt }}" > "$RUNNER_TEMP/failed/failed.txt"
      - uses: actions/upload-artifact@v7
        if: failure() && steps.install.outcome == 'success'
        with:
          name: failed-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failed
          retention-days: 14

  # (optional) the Apple-chip app from the release's own zip, started and driven on an Apple chip. Nothing waits for it: when no such machine
  # is free the release is made without this check. Red because a test or the app failed: do not publish (the maintainer's launch checklist)
  mac-arm64-check:
    name: mac-arm64-check (optional)
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.armcheck == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PDRAFT_SMOKE_SLOW: "4"
    steps:
      - name: Is there an Apple-chip app to check
        id: has
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name' | grep -qx gusset-mac; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::The Mac build did not finish in this run: nothing to check here"; fi
      - uses: actions/checkout@v7
        if: steps.has.outputs.yes == 'true'
      - uses: actions/setup-node@v7
        if: steps.has.outputs.yes == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install
        if: steps.has.outputs.yes == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop
          node desktop/node_modules/electron/install.js
      - name: Unit tests on an Apple chip (not the slow drapes)
        if: steps.has.outputs.yes == 'true'
        shell: bash
        run: node drafter/tests/run.js --fast
      - uses: actions/download-artifact@v8
        if: steps.has.outputs.yes == 'true'
        with:
          name: gusset-mac
          path: dist
      - name: The Apple-chip app unpacked from its zip
        if: steps.has.outputs.yes == 'true'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          A="$RUNNER_TEMP/app"; mkdir -p "$A"; ditto -x -k dist/*-mac-arm64.zip "$A"
          node -e 'const fs = require("fs"), p = require("path"), d = process.argv[1], app = fs.readdirSync(d).find(n => n.endsWith(".app")), P = p.join(d, app);
            fs.writeFileSync(process.argv[2], JSON.stringify({ app: P, exe: p.join(P, "Contents", "MacOS", app.slice(0, -4)), resources: p.join(P, "Contents", "Resources") }, null, 1));' "$A" "$RUNNER_TEMP/unpacked.json"
          cat "$RUNNER_TEMP/unpacked.json"
          lipo -archs "$(node -p "require(process.env.RUNNER_TEMP + '/unpacked.json').exe")"
      - name: Desktop check on its files
        if: steps.has.outputs.yes == 'true'
        shell: bash
        run: |
          export PDRAFT_SMOKE_APP=$(node -p "require(process.env.RUNNER_TEMP + '/unpacked.json').resources")
          npm run smoke:desktop || { echo "--- once more ---"; npm run smoke:desktop; }
      - name: The Apple-chip app started and driven
        if: steps.has.outputs.yes == 'true'
        shell: bash
        run: |
          RUN="node scripts/start-built.js $RUNNER_TEMP/unpacked.json $RUNNER_TEMP/start"
          $RUN || { echo "--- once more ---"; rm -rf "$RUNNER_TEMP/start"; $RUN; }
      - uses: actions/upload-artifact@v7
        if: always() && steps.has.outputs.yes == 'true'
        with:
          name: checks-mac-arm64
          path: ${{ runner.temp }}/start
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # a tag: the draft release, never published here, with every system that was built (one that never ran is listed as missing; a real
  # failure stops it). By hand, from a tag, with attach: the built files added to that tag's release. By hand otherwise (Round r22): a dry run of
  # the same job (the files downloaded, the checksums and the notes put together, the title shown) that creates no release and no tag
  release:
    name: pre-release
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name != 'release' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      published: ${{ steps.r.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - name: Which systems were built, and whether one failed for real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name' | tee "$RUNNER_TEMP/artifacts.txt"
          node scripts/release-parts.js runs "$RUNNER_TEMP/artifacts.txt"
      - uses: actions/download-artifact@v8
        with:
          pattern: gusset-*
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DRY: ${{ github.event_name != 'push' && !inputs.attach }}
          ATTACH: ${{ github.event_name == 'workflow_dispatch' && inputs.attach == true }}
        run: |
          if [ "$ATTACH" = true ] && [ "$GITHUB_REF_TYPE" != tag ]; then echo "::error::To add files to a release, start this run from its tag (Use workflow from > Tags): $TAG is a branch"; exit 1; fi
          V="${TAG#v}"
          CONFIG=$(node -p "require('./drafter/config.js').version")
          if [ "$DRY" = true ]; then V="$CONFIG"; echo "Dry run (no tag): version $V from drafter/config.js";
          elif [ "$V" != "$CONFIG" ]; then echo "The tag says $V, drafter/config.js says $CONFIG"; exit 1; fi
          # (Round r24) the update check's channel files: this version, and every file they name here and matching
          if [ "$PDRAFT_UPDATE_SOURCE" != none ]; then node scripts/update-files-check.js dist "$V"; else echo "Update source none: these builds do not look for updates, so there are no channel files"; fi
          NOTES="docs/release-notes/$V.md"
          test -f "$NOTES" || { echo "No release notes at $NOTES"; exit 1; }
          if [ "$ATTACH" = true ]; then
            # (beta.3 release fix) a system that was missing, added to the release: never over a file that is there, the checksums and the list made whole again
            gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json" || { echo "::error::There is no release for $TAG to add files to: the tag's own run makes it"; exit 1; }
            node scripts/release-parts.js clash "$RUNNER_TEMP/release.json" dist
            NEW=$(ls dist)
            (cd dist && sha256sum $(ls | grep -v '\.sha256$') > "$RUNNER_TEMP/new-sums.txt")
            gh release download "$TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP/old" || true
            node scripts/release-parts.js sums "$RUNNER_TEMP/old/SHA256SUMS.txt" "$RUNNER_TEMP/new-sums.txt" > dist/SHA256SUMS.txt
            node scripts/release-parts.js assets "$RUNNER_TEMP/assets.json" --release "$RUNNER_TEMP/release.json" --dist dist
            node scripts/make-downloads.js --assets "$RUNNER_TEMP/assets.json" --sums dist/SHA256SUMS.txt --version "$V" --repo "$GITHUB_REPOSITORY" --out dist/downloads.json
          else
            (cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt)
            # the website's list for this build: the same in a dry run. (After the checksums, so that it is not one of the files they list)
            node scripts/make-downloads.js --dist dist --version "$V" --repo "$GITHUB_REPOSITORY" --out dist/downloads.json
            node scripts/release-parts.js assets "$RUNNER_TEMP/assets.json" --dist dist
          fi
          cat dist/SHA256SUMS.txt
          cat dist/downloads.json
          BODY="$RUNNER_TEMP/body.md"
          # (the systems not built yet, if any, between the notes and the checksums)
          { cat "$NOTES"; node scripts/release-parts.js missing "$RUNNER_TEMP/assets.json"; printf '\n## SHA-256 of each file\n\n```\n'; cat dist/SHA256SUMS.txt; printf '```\n'; } > "$BODY"
          TITLE="Gusset – Pattern Drafter "$(echo "$V" | sed -E 's/-(alpha|beta|rc)\./ \1 /')
          if [ "$DRY" = true ]; then echo "Would make the draft release \"$TITLE\" with:"; ls -l dist; head -5 "$BODY"; tail -16 "$BODY"; exit 0; fi
          if [ "$ATTACH" = true ]; then
            gh release upload "$TAG" $(for f in $NEW; do echo "dist/$f"; done)          # (no --clobber: clash made sure none of them is there)
            gh release upload "$TAG" dist/SHA256SUMS.txt dist/downloads.json --clobber
            gh release edit "$TAG" --notes-file "$BODY"
            if [ "$(node -p "require(process.env.RUNNER_TEMP + '/release.json').isDraft")" = false ]; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "The release is out already: the website's list and the update feed are written again next"; fi
          else
            PRE=false; case "$V" in *-*) PRE=true ;; esac
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release edit "$TAG" --prerelease="$PRE" --title "$TITLE" --notes-file "$BODY"
            else
              gh release create "$TAG" --draft --prerelease="$PRE" --verify-tag --title "$TITLE" --notes-file "$BODY"
            fi
            gh release upload "$TAG" dist/* --clobber
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'

  # a release published by hand (or one that is out and got a missing system's files: attach): website/downloads.json from every release that
  # is out, committed to the default branch, from where the website is deployed. A push with this job's token starts no workflow, so this cannot go round in a circle
  site-downloads:
    name: the website's list of downloads
    needs: release
    if: ${{ !cancelled() && github.repository == 'fynndose/gusset-pattern-drafter' && (github.event_name == 'release' || needs.release.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Write and commit the list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP" || true
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/make-downloads.js --api "$RUNNER_TEMP/releases.json" --sums "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --out website/downloads.json
          # (Round r29d) the update feed the app reads: only what is published ever reaches it, so a pushed tag or a draft is no version to anyone
          node scripts/make-update-feed.js --api "$RUNNER_TEMP/releases.json" --repo "$GITHUB_REPOSITORY" --out website/updates
          if [ -z "$(git status --porcelain -- website/downloads.json website/updates)" ]; then echo "The list and the feed have not changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/downloads.json website/updates
          git commit -m "The website's list of downloads and update feed, after $TAG"
          git push
