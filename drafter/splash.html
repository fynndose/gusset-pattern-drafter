<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gusset – Pattern Drafter</title>
<!-- (Round r24) The desktop app's start-up splash: its own small window, shown at once while the program's page loads in a
     window that stays hidden until the page is fully ready (Round r32; desktop/main.js: showSplash(), pageUp()). Nothing but this
     file and the mark's picture, no script. (Round r32: a click no longer closes it: there would be nothing on the screen.) The mark sews
     itself once; under it a thin line with a short bar running along it for as long as the splash is up (Round r32: it can be some seconds).
     Under reduced motion the mark stands still (the still mark itself: a picture's own media queries are not sure to follow the system)
     and the line fills once. -->
<style>
  html, body { margin: 0; height: 100%; background: #1F1F1F; overflow: hidden; cursor: default; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 13px system-ui, sans-serif; color: #FAFAF7; }
  img { width: 150px; height: auto; display: block; }
  @media (prefers-reduced-motion: reduce) { img { width: 116px; margin: 17px; } }
  .name { letter-spacing: .04em; opacity: .9; }
  .line { width: 120px; height: 2px; background: #3a3a3a; overflow: hidden; display: block; }
  .line::after { content: ""; display: block; height: 100%; width: 30%; background: #FAFAF7; transform: translateX(-100%); animation: run 1.4s .6s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(.9); } }
  @media (prefers-reduced-motion: reduce) { .line::after { width: 100%; transform-origin: 0 50%; animation: fill 1.2s ease-out forwards; } }
</style>
</head>
<body>
<picture><source media="(prefers-reduced-motion: reduce)" srcset="assets/brand/gusset-mark.svg"><img src="assets/brand/gusset-mark-sewn.svg" alt=""></picture>
<div class="name">Gusset</div>
<div class="line" role="progressbar" aria-label="Starting"></div>
</body>
</html>
